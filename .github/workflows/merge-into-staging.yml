name: Merge release branches into staging

# Keeps one pull request open for each release branch while it has commits
# that staging lacks. These pull requests must be merged with a merge commit.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency: merge-into-staging

jobs:
  merge:
    uses: aleo-labs-protocol/gh-actions/.github/workflows/merge-branches.yml@v2
    permissions: { contents: read, pull-requests: read }
    with:
      target: staging
      sources: release/*
    # Lives in the merge-bot environment, which admits only staging. The called
    # workflow's merge job sets that environment and receives the value.
    secrets:
      MERGE_BOT_APP_KEY: ${{ secrets.MERGE_BOT_APP_KEY }}
