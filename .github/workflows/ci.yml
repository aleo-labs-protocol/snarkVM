name: CI

on:
  pull_request:
  push:
    branches: [staging, 'release/**']
  workflow_dispatch:

permissions: { contents: read }

# A superseded run holds one-slot boxes the newest commit is queued behind, so
# a new push to a PR or branch cancels it: only the newest commit on each branch
# gets a verdict. A manual dispatch is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  # Overrides `target-cpu=native` in .cargo/config.toml. The cpu fleet mixes
  # Intel and AMD instance types, so native code built on one box is not
  # portable to the next, nor is its sccache entry.
  RUSTFLAGS: ""
  RUST_MIN_STACK: 67108864

# Every self-hosted job carries the same guard: a fork's code never runs on
# the fleet, whose target dirs and sccache persist between jobs.
jobs:
  start-cpu-runners:
    uses: aleo-labs-protocol/gh-actions/.github/workflows/start-runner.yml@v2
    permissions: { id-token: write, contents: read, actions: read }
    secrets:
      runner_app_key: ${{ secrets.RUNNER_APP_KEY }}
    with:
      role-to-assume: ${{ vars.RUNNER_ROLE_ARN }}
      label: cpu
      # Below the default of 3: snarkVM's jobs run ten minutes or more, so a
      # box absorbs fewer of them within the critical path.
      jobs-per-box: 2
      runner-app-id: ${{ vars.RUNNER_APP_ID }}
    if: >-
      github.event.pull_request == null ||
      github.event.pull_request.head.repo.full_name == github.repository

  check-shared-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: aleo-labs-protocol/gh-actions/.github/actions/check-shared-refs@v2

  fmt:
    runs-on: ubuntu-latest
    env:
      # `.rustfmt.toml` uses nightly-only options, which stable drops without
      # an error. Bumping this pin may reformat the tree.
      FMT_TOOLCHAIN: nightly-2026-04-02
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - run: rustup toolchain install "$FMT_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo "+$FMT_TOOLCHAIN" fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny@0.20.2 }
      # Advisories: bump-advisories.yml.
      - run: cargo deny check bans licenses sources

  wasm:
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/staging' }}
      - uses: ./.github/actions/rust-cache-prune
        if: github.ref == 'refs/heads/staging'
        with: { key: wasm }
      - run: wasm-pack test --node
        working-directory: wasm

  lint:
    needs: start-cpu-runners
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: >-
      github.event.pull_request == null ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Clippy covers everything but the release profile, which only the
      # release branches need checked.
      - run: cargo check --release --workspace --all-targets
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.base_ref, 'release/')

  # Each entry is one build. `cargo test -p a -p b` unifies the features of
  # a and b, and several crates enable `test`, `rocks` or
  # `test_consensus_heights` on their dependencies, which changes what those
  # dependencies compute. Crates share an entry only where that unification
  # enables none of those features, nor `wasm` or `large_params`, on any
  # snarkvm crate. Helper features such as `test-helpers` can still be unified.
  #
  # Cheap entries run on free hosted runners, the rest on the fleet.
  test:
    needs: start-cpu-runners
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: >-
      github.event.pull_request == null ||
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ignored tests run without `filesystem`, and read the powers
          # files that the runs with it cache in ~/.aleo/resources.
          - name: crates
            runs: |
              nextest run -p snarkvm -p snarkvm-algorithms -p snarkvm-circuit-collections -p snarkvm-circuit-types-integers -p snarkvm-console-collections
              nextest run -p snarkvm-parameters --features filesystem -E test(/powers::tests/)
              nextest run -p snarkvm-parameters --run-ignored all
              nextest run -p snarkvm-algorithms --run-ignored ignored-only
          - name: ledger
            runs: |
              nextest run -p snarkvm-ledger
              nextest run -p snarkvm-ledger --features test -E test(/^tests::valid_solutions::/)
          # ledger-query's async tests bound wall-clock time, which a loaded
          # hosted runner can exceed.
          - name: ledger-store
            runs: |
              nextest run -p snarkvm-ledger-store --features rocks
              nextest run -p snarkvm-ledger-store --lib --features dev_genesis_state_root,test -E test(test_genesis_commitment_checks_passed_block_tree_root)
              nextest run -p snarkvm-ledger-narwhal-data -p snarkvm-ledger-test-helpers
              nextest run -p snarkvm-ledger-puzzle -p snarkvm-ledger-puzzle-epoch
              nextest run -p snarkvm-ledger-query --features async
          - name: synthesizer
            runs: nextest run -p snarkvm-synthesizer --lib --bins -j 16
          - name: synthesizer-process
            runs: |
              nextest run -p snarkvm-synthesizer-process
              nextest run -p snarkvm-synthesizer-program --lib --bins
              nextest run -p snarkvm-circuit-program
    name: test (${{ matrix.name }})
    steps: &test-steps
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/staging' }}
      # rust-cache mints a key per dependency set and removes none.
      - uses: ./.github/actions/rust-cache-prune
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/staging'
        with: { key: '${{ matrix.name }}' }
      # Downloaded parameters. A box keeps its own; a hosted runner starts
      # without, and parallel tests downloading the same file can read it
      # half-written.
      - uses: actions/cache/restore@v6
        if: runner.environment == 'github-hosted'
        with: &aleo-resources
          path: ~/.aleo/resources
          key: aleo-resources-${{ matrix.name }}-${{ hashFiles('parameters/**/*.metadata') }}
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-nextest@0.9.114 }
      # Each line of `runs` is one cargo command.
      - name: Test
        env:
          RUNS: ${{ matrix.runs }}
          # Exercises the download path, which a box's persistent
          # ~/.aleo/resources would otherwise skip.
          FRESH_HOME: ${{ matrix.name == 'parameters-uncached' }}
          NEXTEST_PROFILE: ci
          NEXTEST_NO_TESTS: fail
        run: |
          if [ "$FRESH_HOME" = true ]; then
            export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
            HOME="$RUNNER_TEMP/home"
            mkdir -p "$HOME"
            export HOME
          fi
          # Under the workspace, wherever CARGO_TARGET_DIR points.
          junit=target/nextest/ci/junit.xml
          mkdir -p "$RUNNER_TEMP/junit"
          rc=0 n=0
          while read -ra args; do
            [ "${#args[@]}" -gt 0 ] || continue
            echo "::group::cargo ${args[*]}"
            start=$SECONDS
            rm -f "$junit"
            cargo "${args[@]}" < /dev/null || rc=1
            echo "::endgroup::"
            echo "${args[*]}: $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -f "$junit" ]; then mv "$junit" "$RUNNER_TEMP/junit/$((n += 1)).xml"; fi
          done <<< "$RUNS"
          exit "$rc"
      # Per-test timings, for deciding what to shard or drop.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.name }}
          path: ${{ runner.temp }}/junit
          overwrite: true
      - uses: actions/cache/save@v6
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/staging'
        with: *aleo-resources

  # The cheap entries, on hosted runners: they wait for no box, and a fork's
  # pull request runs them too.
  test-hosted:
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            runs: >-
              nextest run -p snarkvm-console -p snarkvm-console-account -p snarkvm-console-algorithms
              -p snarkvm-console-network -p snarkvm-console-network-environment -p snarkvm-console-program
              -p snarkvm-console-types -p snarkvm-console-types-address -p snarkvm-console-types-boolean
              -p snarkvm-console-types-field -p snarkvm-console-types-group -p snarkvm-console-types-integers
              -p snarkvm-console-types-scalar -p snarkvm-console-types-string
          - name: circuit
            runs: |
              nextest run -p snarkvm-circuit -p snarkvm-circuit-account -p snarkvm-circuit-algorithms -p snarkvm-circuit-network -p snarkvm-circuit-types -p snarkvm-circuit-types-address -p snarkvm-circuit-types-boolean -p snarkvm-circuit-types-field -p snarkvm-circuit-types-group -p snarkvm-circuit-types-scalar -p snarkvm-circuit-types-string
              nextest run -p snarkvm-circuit-environment
          - name: narwhal
            runs: >-
              nextest run -p snarkvm-ledger-authority -p snarkvm-ledger-committee -p snarkvm-ledger-narwhal
              -p snarkvm-ledger-narwhal-batch-certificate -p snarkvm-ledger-narwhal-batch-header
              -p snarkvm-ledger-narwhal-subdag -p snarkvm-ledger-narwhal-transmission
              -p snarkvm-ledger-narwhal-transmission-id -p snarkvm-synthesizer-snark
              -p snarkvm-curves -p snarkvm-fields -p snarkvm-utilities -p snarkvm-utilities-derives
    name: test (${{ matrix.name }})
    steps: *test-steps

  # Slower suites that rarely fail where the PR set passed. On every push, on
  # pull requests to a release branch, and on demand.
  test-merge:
    needs: start-cpu-runners
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.base_ref, 'release/') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ledger-rocks
            runs: nextest run -p snarkvm-ledger --release --features rocks -j 10
          - name: ledger-merge
            runs: |
              nextest run -p snarkvm-ledger --features test --run-ignored ignored-only -E test(/^tests::valid_solutions::/)
              nextest run -p snarkvm-ledger-store --run-ignored ignored-only -j 2
              nextest run -p snarkvm-ledger-block -j 12
          - name: parameters
            runs: nextest run -p snarkvm-parameters --features filesystem -j 2
          - name: parameters-uncached
            runs: nextest run -p snarkvm-parameters --features filesystem --run-ignored ignored-only -j 2
          - name: synthesizer-release
            runs: nextest run -p snarkvm-synthesizer --release --lib --bins --features test -j 8
          - name: synthesizer-prerelease
            runs: |
              nextest run -p snarkvm-synthesizer --features test --run-ignored ignored-only -j 2
              nextest run -p snarkvm-synthesizer-process --features rocks -j 4
          - name: synthesizer-integration
            runs: nextest run -p snarkvm-synthesizer --features test,dev-print -j 4 --test *
          - name: synthesizer-program
            runs: |
              nextest run -p snarkvm-synthesizer-program --test lib -j 8 -E !test(/keccak|psd|sha|instruction::is|instruction::commit/)
              nextest run -p snarkvm-synthesizer-program --test lib -j 4 -E test(/keccak|sha/)
              nextest run -p snarkvm-synthesizer-program --test lib -E test(/psd|instruction::is|instruction::commit/)
    name: test (${{ matrix.name }})
    steps: *test-steps

  machete:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || startsWith(github.base_ref, 'release/')
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-machete@0.7.0 }
      - run: cargo machete

  windows:
    runs-on: windows-latest
    permissions: { contents: read, actions: write }
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.base_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        dir: [algorithms, circuit, console, curves, fields, ledger, parameters, synthesizer, utilities]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.dir }}
          save-if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
      - uses: ./.github/actions/rust-cache-prune
        if: startsWith(github.ref, 'refs/heads/release/')
        with: { key: '${{ matrix.dir }}' }
      - run: cargo check --examples --benches --tests
        working-directory: ${{ matrix.dir }}

  # The one check to require. A skipped job counts as passing a required check,
  # and a fleet job is skipped when the boxes fail to start or the pull request
  # comes from a fork; here anything but success fails. The exception is a
  # merge or release job skipped outside a release branch, where it is not
  # meant to run.
  ci-ok:
    if: always()
    needs: [check-shared-refs, fmt, deny, wasm, lint, test, test-hosted, test-merge, machete, windows]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: >-
            ${{ github.event_name == 'workflow_dispatch' ||
            startsWith(github.ref, 'refs/heads/release/') ||
            startsWith(github.base_ref, 'release/') }}
        run: |
          jq -e --argjson release "$RELEASE" 'to_entries | map(select(.value.result != "success" and ($release or .value.result != "skipped" or (.key | IN("test-merge", "machete", "windows") | not)))) | if length == 0 then true else (map("\(.key): \(.value.result)") | join(", ") | halt_error) end' <<< "$NEEDS"
