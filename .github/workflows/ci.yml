name: CI

on:
  pull_request:
    # A pull request that changes only Markdown starts no run. The files under
    # curves/documentation are compiled into snarkvm-curves, so they count as code.
    paths:
      - '**'
      - '!**.md'
      - 'curves/documentation/**'
  push:
    branches: [staging, 'release/**']
  workflow_dispatch:

permissions: { contents: read }

# A superseded run holds one-slot boxes the newest commit is queued behind, so
# a new push to a PR or branch cancels it: only the newest commit on each branch
# gets a verdict. A manual dispatch is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 67108864

# GitHub holds an outside contributor's pull request run until a maintainer
# approves it. A fork's run gets no secrets, so start-cpu-runners is skipped and
# fork-pr-runners.yml starts the boxes. The fleet jobs therefore accept a
# skipped start-cpu-runners, and run only in this repository, which alone may
# use the fleet.
#
# The fleet jobs also wait for check-shared-refs, a hosted job. GitHub reports
# a run as `in_progress`, and fires the `workflow_run` event that starts the
# boxes, only once none of its ready jobs is waiting for a runner. With no
# hosted job ahead of them, a fork's fleet jobs would wait for boxes that only
# that event starts.
#
# A push runs CI only in this repository. A mirror receives this branch by
# push, with this file, and would otherwise rerun CI on its own runners.
jobs:
  start-cpu-runners:
    # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
    uses: aleo-labs-protocol/gh-actions/.github/workflows/start-runner.yml@v2
    permissions: { id-token: write, contents: read, actions: read }
    secrets:
      runner_app_key: ${{ secrets.RUNNER_APP_KEY }}
    with:
      role-to-assume: ${{ vars.RUNNER_ROLE_ARN }}
      label: cpu
      # Below the default of 3: snarkVM's jobs run ten minutes or more, so a
      # box absorbs fewer of them within the critical path. fork-pr-runners.yml
      # repeats this.
      jobs-per-box: 2
      runner-app-id: ${{ vars.RUNNER_APP_ID }}
    if: >-
      (github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM') &&
      (github.event.pull_request == null ||
       github.event.pull_request.head.repo.full_name == github.repository)

  check-shared-refs:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/check-shared-refs@v2
      # An `include` name missing from its `name` axis adds a leg instead of failing.
      - name: Check that each matrix name axis matches its include names
        run: |
          bad=$(yq '.jobs[].strategy.matrix | select(.name != null) | (.name - [.include[].name]) + ([.include[].name] - .name) | .[]' .github/workflows/ci.yml)
          echo "$bad"
          [ -z "$bad" ]

  fmt:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM'
    env:
      # `.rustfmt.toml` uses nightly-only options, which stable drops without
      # an error. Bumping this pin may reformat the tree.
      FMT_TOOLCHAIN: nightly-2026-04-02
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: rustup toolchain install "$FMT_TOOLCHAIN" --profile minimal --component rustfmt
      - run: cargo "+$FMT_TOOLCHAIN" fmt --all -- --check

  deny:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-deny@0.20.2 }
      # Advisories: bump-advisories.yml.
      - run: cargo deny check bans licenses sources

  source-checks:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: scripts/check_sources.py

  # Every tracked file of snarkvm-algorithms-cuda must be in its crate archive.
  # Without `build.rs`, Cargo only warns and drops the build script, and the
  # published crate builds without its kernels even where nvcc is installed.
  cuda-package-files:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: |
          packaged=$(cargo package --locked --list -p snarkvm-algorithms-cuda)
          missing=$(comm -23 \
            <(git ls-files algorithms/cuda | sed 's|^algorithms/cuda/||' | sort) \
            <(sort <<<"$packaged"))
          if [ -n "$missing" ]; then
            echo "::error::Missing from the snarkvm-algorithms-cuda archive: ${missing//$'\n'/ }"
            exit 1
          fi

  wasm:
    permissions: { contents: read, actions: write }
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22 }
      - run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: wasm-pack }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
          save-if: ${{ github.ref == 'refs/heads/staging' }}
      - uses: ./.github/actions/rust-cache-prune
        if: github.ref == 'refs/heads/staging'
        with: { key: wasm }
      - run: wasm-pack test --node
        working-directory: wasm

  lint:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: &fleet-if >-
      !cancelled() && needs.check-shared-refs.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkVM'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Some features remove items, so this does not check the docs of items that
      # exist only without a feature. It also accepts links from ungated docs to
      # feature-gated items, which break in a default-features build such as docs.rs.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # Clippy covers everything but the release profile, which only the
      # release branches need checked.
      - run: cargo check --release --workspace --all-targets
        if: &release-only >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/heads/release/') ||
          startsWith(github.base_ref, 'release/')
      # Compiles the kernels from the crate archive, against the archives of the
      # workspace crates it depends on. `build.rs` skips the kernels when it finds
      # no nvcc, so the step requires one.
      - name: Build snarkvm-algorithms-cuda from its crate archive
        if: *release-only
        run: |
          command -v "${NVCC-nvcc}"
          cargo package --locked \
            -p snarkvm-utilities-derives -p snarkvm-utilities \
            -p snarkvm-fields -p snarkvm-curves -p snarkvm-algorithms-cuda

  lint-locktick:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: *fleet-if
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      # An env RUSTFLAGS replaces `--cfg locktick` without an error, and the
      # build then has no locktick dependency.
      - name: Check that the build sets cfg(locktick)
        run: cargo locktick-clippy -q -p snarkvm-utilities --message-format=json | grep '"name":"locktick"' > /dev/null
      - run: cargo locktick-clippy --workspace --all-targets --all-features -- -D warnings

  # The public API of each crate against the newest release tag `vX.Y.Z` in the
  # history of the base branch, or of the pushed branch. The job summary lists
  # the failed lints of each crate, and the artifact `semver-checks` holds the
  # full report. A semver break fails the job only on a release branch, on a
  # pull request into one, and on demand. A tool error fails it on any event.
  semver:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: *fleet-if
    steps:
      # The full history, so that the release tags and their ancestry are here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      # The persistent CARGO_TARGET_DIR it sets also keeps cargo-semver-checks
      # from making a target dir for each crate.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-semver-checks@0.51.0 }
      # cargo-semver-checks exits with 100 when a lint fails, and with another
      # nonzero code when it cannot complete the check. Without
      # `--default-features` it enables nearly every feature, build-mode ones
      # such as `serial` and `locktick` included, and some release tags do not
      # build with them.
      - name: Check semver against the newest release tag
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          BLOCKING: >-
            ${{ github.event_name == 'workflow_dispatch' ||
            startsWith(github.ref, 'refs/heads/release/') ||
            startsWith(github.base_ref, 'release/') }}
          REPORT: ${{ runner.temp }}/semver-checks/report.txt
        run: |
          set -o pipefail
          tag=$(git tag --merged "$BASE" --list 'v*' --sort=-v:refname | grep -xE 'v[0-9]+\.[0-9]+\.[0-9]+' | awk 'NR == 1' || true)
          if [ -z "$tag" ]; then
            echo "::error::No release tag vX.Y.Z is an ancestor of $BASE."
            exit 1
          fi
          echo "Baseline: \`$tag\`" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p "$(dirname "$REPORT")"
          rc=0
          cargo semver-checks --workspace --default-features --baseline-rev "$tag" --color never 2>&1 | tee "$REPORT" || rc=$?
          case "$rc" in
            0)
              echo "No semver breaks." >> "$GITHUB_STEP_SUMMARY"
              ;;
            100)
              {
                echo
                echo "| Crate | Level | Lint | Items |"
                echo "|---|---|---|---|"
                awk '
                  function emit() { printf "| `%s` | %s | `%s` | %d |\n", crate, level, lint, n; lint = "" }
                  /^ +Checking .* -> / { crate = $2 }
                  /^--- (failure|warning) / { if (lint != "") emit(); level = $2; lint = $3; sub(/:$/, "", lint); n = 0; items = 0; next }
                  /^Failed in:/ { items = 1; next }
                  items && /^  [^ ]/ { n++; next }
                  items { items = 0; emit() }
                  END { if (lint != "") emit() }
                ' "$REPORT"
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$BLOCKING" = true ]; then
                echo "::error::Semver breaks against $tag; see the job summary."
                exit 1
              fi
              echo "::warning::Semver breaks against $tag; see the job summary. They fail only on a release branch."
              ;;
            *)
              grep '^error' "$REPORT" >> "$GITHUB_STEP_SUMMARY" || true
              echo "::error::cargo-semver-checks exited with $rc."
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: semver-checks
          path: ${{ runner.temp }}/semver-checks
          overwrite: true

  # `cargo test -p a -p b` unifies the features of a and b, and several crates
  # enable `test`, `rocks` or `test_consensus_heights` on their dependencies,
  # which changes what those dependencies compute. Crates share a command only
  # where that unification enables none of those features, nor `wasm` or
  # `large_params`, on any snarkvm crate. Helper features such as
  # `test-helpers` can still be unified. Each command in an entry with a
  # different feature set rebuilds the snarkvm crates whose features change.
  #
  # Cheap entries run on free hosted runners, the rest on the fleet.
  test:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: *fleet-if
    strategy:
      fail-fast: false
      matrix:
        include:
          # The first run's powers tests, with `filesystem`, cache the powers
          # files in ~/.aleo/resources. The ignored tests run without
          # `filesystem`, and read those files. The last two runs share a build.
          - name: crates
            runs: |
              nextest run -p snarkvm -p snarkvm-algorithms -p snarkvm-circuit-collections -p snarkvm-circuit-types-integers -p snarkvm-console-collections -p snarkvm-parameters --features snarkvm-parameters/filesystem -E !package(snarkvm-parameters)|test(/powers::tests/)
              nextest run -p snarkvm-parameters -p snarkvm-algorithms --run-ignored all -E package(snarkvm-parameters)
              nextest run -p snarkvm-parameters -p snarkvm-algorithms --run-ignored ignored-only -E package(snarkvm-algorithms)
          - name: ledger
            runs: nextest run -p snarkvm-ledger
          # ledger-query's async tests bound wall-clock time, which a loaded
          # hosted runner can exceed.
          - name: ledger-store
            runs: |
              nextest run -p snarkvm-ledger-store --features rocks
              nextest run -p snarkvm-ledger-narwhal-data -p snarkvm-ledger-test-helpers
              nextest run -p snarkvm-ledger-puzzle -p snarkvm-ledger-puzzle-epoch
              nextest run -p snarkvm-ledger-query --features async
          - name: synthesizer
            runs: nextest run -p snarkvm-synthesizer --lib --bins -j 16
          - name: synthesizer-process
            runs: |
              nextest run -p snarkvm-synthesizer-process
              nextest run -p snarkvm-synthesizer-program --lib --bins
              nextest run -p snarkvm-circuit-program
          # nextest runs no doctests. The `compile_fail` doctests check that
          # outside crates cannot implement the sealed traits. This entry is one
          # workspace build, so it unifies `test` and `rocks`, which no doctest
          # depends on. Leaving out snarkvm-wasm keeps `wasm` off. The doctests
          # of the RocksDB maps need `rocks`; the flag enables it even if no
          # dev-dependency does.
          - name: doctests
            runs: test --workspace --exclude snarkvm-wasm --doc --features snarkvm-ledger-store/rocks
    name: test (${{ matrix.name }})
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          key: ${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/') }}
      # rust-cache mints a key per dependency set and removes none.
      - uses: ./.github/actions/rust-cache-prune
        if: runner.environment == 'github-hosted' && github.ref == 'refs/heads/staging'
        with: { key: '${{ matrix.name }}' }
      # Downloaded parameters. A box keeps its own; a hosted runner starts
      # without, and parallel tests downloading the same file can read it
      # half-written.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with: &aleo-resources
          path: ~/.aleo/resources
          key: aleo-resources-${{ matrix.name }}-${{ hashFiles('parameters/**/*.metadata') }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-nextest@0.9.114 }
      # An env RUSTFLAGS replaces the flags in .cargo/config.toml without an
      # error. ADX is what `skylake` has and `x86-64-v3` lacks.
      - name: Check that the build targets skylake
        if: runner.arch == 'X64'
        run: cargo rustc -q -p snarkvm-utilities-derives --lib -- --print cfg | grep -q 'target_feature="adx"'
      # Each line of `runs` is one cargo command, split on whitespace with no
      # quote handling.
      - name: Test
        env:
          RUNS: ${{ matrix.runs }}
          # Exercises the download path, which a box's persistent
          # ~/.aleo/resources would otherwise skip.
          FRESH_HOME: ${{ matrix.name == 'parameters-uncached' }}
          NEXTEST_PROFILE: ci
          NEXTEST_NO_TESTS: fail
        run: |
          if [ "$FRESH_HOME" = true ]; then
            export CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
            HOME="$RUNNER_TEMP/home"
            mkdir -p "$HOME"
            export HOME
          fi
          # Under the workspace, wherever CARGO_TARGET_DIR points.
          junit=target/nextest/ci/junit.xml
          mkdir -p "$RUNNER_TEMP/junit"
          rc=0 n=0
          while read -ra args; do
            [ "${#args[@]}" -gt 0 ] || continue
            echo "::group::cargo ${args[*]}"
            start=$SECONDS
            rm -f "$junit"
            cargo "${args[@]}" < /dev/null || rc=1
            echo "::endgroup::"
            echo "${args[*]}: $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -f "$junit" ]; then mv "$junit" "$RUNNER_TEMP/junit/$((n += 1)).xml"; fi
          done <<< "$RUNS"
          exit "$rc"
      # Per-test timings, for deciding what to shard or drop.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.name }}
          path: ${{ runner.temp }}/junit
          overwrite: true
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted' && (github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/'))
        with: *aleo-resources

  # The cheap entries, on hosted runners: they wait for no box.
  test-hosted:
    permissions: { contents: read, actions: write }
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: console
            os: ubuntu-latest
            runs: >-
              nextest run -p snarkvm-console -p snarkvm-console-account -p snarkvm-console-algorithms
              -p snarkvm-console-network -p snarkvm-console-network-environment -p snarkvm-console-program
              -p snarkvm-console-types -p snarkvm-console-types-address -p snarkvm-console-types-boolean
              -p snarkvm-console-types-field -p snarkvm-console-types-group -p snarkvm-console-types-integers
              -p snarkvm-console-types-scalar -p snarkvm-console-types-string
          - name: circuit
            os: ubuntu-latest
            runs: |
              nextest run -p snarkvm-circuit -p snarkvm-circuit-account -p snarkvm-circuit-algorithms -p snarkvm-circuit-network -p snarkvm-circuit-types -p snarkvm-circuit-types-address -p snarkvm-circuit-types-boolean -p snarkvm-circuit-types-field -p snarkvm-circuit-types-group -p snarkvm-circuit-types-scalar -p snarkvm-circuit-types-string
              nextest run -p snarkvm-circuit-environment
          - name: narwhal
            os: ubuntu-latest
            runs: >-
              nextest run -p snarkvm-ledger-authority -p snarkvm-ledger-committee -p snarkvm-ledger-narwhal
              -p snarkvm-ledger-narwhal-batch-certificate -p snarkvm-ledger-narwhal-batch-header
              -p snarkvm-ledger-narwhal-subdag -p snarkvm-ledger-narwhal-transmission
              -p snarkvm-ledger-narwhal-transmission-id -p snarkvm-synthesizer-snark
              -p snarkvm-curves -p snarkvm-fields -p snarkvm-utilities -p snarkvm-utilities-derives
          # What differs off x86-64: the bigint carry arithmetic, and the
          # batched MSM's batch size and prefetching.
          - name: arithmetic-linux-arm64
            os: ubuntu-24.04-arm
            runs: |
              nextest run -p snarkvm-curves -p snarkvm-fields -p snarkvm-utilities -p snarkvm-utilities-derives
              nextest run -p snarkvm-algorithms
          - name: arithmetic-macos-arm64
            os: macos-15
            runs: |
              nextest run -p snarkvm-curves -p snarkvm-fields -p snarkvm-utilities -p snarkvm-utilities-derives
              nextest run -p snarkvm-algorithms
    name: test (${{ matrix.name }})
    steps: *test-steps

  # Slower suites that rarely fail where the PR set passed. On every push, on
  # pull requests to a release branch, and on demand.
  test-merge:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: >-
      !cancelled() && needs.check-shared-refs.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkVM' &&
      (github.event_name != 'pull_request' || startsWith(github.base_ref, 'release/'))
    strategy:
      fail-fast: false
      matrix:
        name: [ledger-rocks, ledger-merge, parameters, parameters-uncached, synthesizer-test-1, synthesizer-test-2, synthesizer-prerelease, synthesizer-integration, synthesizer-program]
        include:
          - name: ledger-rocks
            runs: nextest run -p snarkvm-ledger --release --features rocks -j 10
          # Only this entry runs valid_solutions and the genesis tests that need
          # `dev_genesis_state_root`, so pull requests to staging do not.
          # valid_solutions needs `test`, whose low proof targets let it find valid
          # solutions. `dev_genesis_state_root` fixes the stored genesis state root.
          # test_cumulative_proof_target_correctness is left out: it takes 150 s or 475 s from run to run.
          - name: ledger-merge
            runs: |
              nextest run -p snarkvm-ledger --features test --run-ignored all -E test(/^tests::valid_solutions::/)&!test(test_cumulative_proof_target_correctness)
              nextest run -p snarkvm-ledger-store --run-ignored ignored-only -j 2
              nextest run -p snarkvm-ledger-store --lib --features dev_genesis_state_root,test -E test(test_genesis_commitment_checks_passed_block_tree_root)|test(test_dev_genesis_state_root)
              nextest run -p snarkvm-ledger --features dev_genesis_state_root,test -E test(test_load_dev_genesis_state_root)
              nextest run -p snarkvm-ledger-block -j 12
          - name: parameters
            runs: nextest run -p snarkvm-parameters --features filesystem -j 2
          - name: parameters-uncached
            runs: nextest run -p snarkvm-parameters --features filesystem --run-ignored ignored-only -j 2
          # Two shards: the tests keep all 8 slots busy for the whole run, so only
          # more runners make it finish sooner.
          - name: synthesizer-test-1
            runs: nextest run -p snarkvm-synthesizer --lib --bins --features test -j 8 --partition count:1/2
          - name: synthesizer-test-2
            runs: nextest run -p snarkvm-synthesizer --lib --bins --features test -j 8 --partition count:2/2
          - name: synthesizer-prerelease
            runs: |
              nextest run -p snarkvm-synthesizer --features test --run-ignored ignored-only -j 2
              nextest run -p snarkvm-synthesizer-process --features rocks -j 4
          - name: synthesizer-integration
            runs: nextest run -p snarkvm-synthesizer --features test,dev-print -j 4 --test *
          - name: synthesizer-program
            runs: |
              nextest run -p snarkvm-synthesizer-program --test lib -j 8 -E !test(/keccak|psd|sha|instruction::is|instruction::commit/)
              nextest run -p snarkvm-synthesizer-program --test lib -j 4 -E test(/keccak|sha/)
              nextest run -p snarkvm-synthesizer-program --test lib -E test(/psd|instruction::is|instruction::commit/)
    # No expression: GitHub shows a skipped job's `name` unevaluated.
    name: test-merge
    steps: *test-steps

  # Each crate alone, with no features and with each feature on its own. The
  # workspace builds in `lint` unify features across crates, so they miss a
  # feature that does not enable what its code uses, and they never build the
  # side of a `cfg(not(feature = ...))` that a unified feature turns off.
  # `lint` builds `cuda` with `--all-features`. `no-embedded-srs` is a
  # `compile_error!` without `filesystem` or `wasm`. `dev_skip_checks` is a
  # `compile_error!` without `test_consensus_heights`. Too slow for every pull
  # request, so on every push, on pull requests to a release branch, and on
  # demand.
  each-feature:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 90
    if: >-
      !cancelled() && needs.check-shared-refs.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkVM' &&
      (github.event_name != 'pull_request' || startsWith(github.base_ref, 'release/'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # gh-actions is ours; check-shared-refs requires a @vN tag here, not a SHA.
      - uses: aleo-labs-protocol/gh-actions/.github/actions/runner-job-setup@v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-hack@0.6.46 }
      # No `--no-dev-deps`: it rewrites the manifests, which breaks `--locked`.
      - run: cargo hack clippy --workspace --each-feature --exclude-features cuda,no-embedded-srs,dev_skip_checks --locked -- -D warnings

  # Suites that take too long for every push. On a release branch, on pull
  # requests to one, and on demand.
  test-release:
    needs: [check-shared-refs, start-cpu-runners]
    runs-on: [self-hosted, linux, x64, cpu]
    timeout-minutes: 120
    if: >-
      !cancelled() && needs.check-shared-refs.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.start-cpu-runners.result) &&
      github.repository == 'aleo-labs-protocol/snarkVM' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.ref, 'refs/heads/release/') ||
       startsWith(github.base_ref, 'release/'))
    strategy:
      fail-fast: false
      matrix:
        name: [old-consensus-versions-1, old-consensus-versions-2, old-consensus-versions-3, integers-exhaustive, synthesizer-rocks]
        include:
          # Three shards, each on its own box. `count:` deals the tests out in
          # name order, so each slow `test_v14` module spreads across shards.
          - name: old-consensus-versions-1
            runs: nextest run -p snarkvm-synthesizer --release --lib --features test-old-consensus-versions -j 8 --run-ignored all --partition count:1/3 -E test(/^vm::tests::test_v(8|9|1[0134])::/)
          - name: old-consensus-versions-2
            runs: nextest run -p snarkvm-synthesizer --release --lib --features test-old-consensus-versions -j 8 --run-ignored all --partition count:2/3 -E test(/^vm::tests::test_v(8|9|1[0134])::/)
          - name: old-consensus-versions-3
            runs: nextest run -p snarkvm-synthesizer --release --lib --features test-old-consensus-versions -j 8 --run-ignored all --partition count:3/3 -E test(/^vm::tests::test_v(8|9|1[0134])::/)
          # Not `--release`: that compiles out the check in `is_satisfied` that
          # each constraint uses only declared variables.
          - name: integers-exhaustive
            runs: nextest run -p snarkvm-circuit-types-integers --run-ignored ignored-only
          # `rocks` alone is the feature set nodes ship. `test` changes network
          # constants and adds tests, so each set runs. Of the integration targets,
          # only test_vm_execute_and_finalize opens a RocksDB store.
          - name: synthesizer-rocks
            runs: |
              nextest run -p snarkvm-synthesizer --release --lib --bins --features rocks -j 8
              nextest run -p snarkvm-synthesizer --release --lib --bins --features test,rocks -j 8
              nextest run -p snarkvm-synthesizer --release --lib --bins --features test,rocks -j 2 --run-ignored ignored-only
              nextest run -p snarkvm-synthesizer --release --features test,rocks --test test_vm_execute_and_finalize
    name: test-release
    steps: *test-steps

  # The release profile on arm64: opt-level 3 and thin LTO, with no debug
  # assertions. On a release branch and on demand.
  test-release-arm:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.base_ref, 'release/')
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    strategy:
      fail-fast: false
      matrix:
        name: [arithmetic-release-linux-arm64, arithmetic-release-macos-arm64]
        include:
          # Default flags, so the target CPU is `generic`.
          - name: arithmetic-release-linux-arm64
            os: ubuntu-24.04-arm
            runs: &arithmetic-release |
              nextest run --release -p snarkvm-curves -p snarkvm-fields -p snarkvm-utilities -p snarkvm-utilities-derives
              nextest run --release -p snarkvm-algorithms
          # `apple-a7` is the default target CPU of an iOS device build. Only the
          # code generation changes: the target is still macOS.
          - name: arithmetic-release-macos-arm64
            os: macos-15
            rustflags: -C target-cpu=apple-a7
            runs: *arithmetic-release
    name: test-release-arm
    steps: *test-steps

  machete:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM') &&
      (github.event_name != 'pull_request' || startsWith(github.base_ref, 'release/'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with: { tool: cargo-machete@0.7.0 }
      - run: cargo machete

  windows:
    runs-on: windows-latest
    permissions: { contents: read, actions: write }
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.base_ref, 'release/')
    strategy:
      fail-fast: false
      matrix:
        dir: [algorithms, circuit, console, curves, fields, ledger, parameters, synthesizer, utilities]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.dir }}
          save-if: ${{ startsWith(github.ref, 'refs/heads/release/') }}
      - uses: ./.github/actions/rust-cache-prune
        if: startsWith(github.ref, 'refs/heads/release/')
        with: { key: '${{ matrix.dir }}' }
      - run: cargo check --examples --benches --tests
        working-directory: ${{ matrix.dir }}

  # The one check to require. A skipped job counts as passing a required check,
  # and a fleet job is skipped when the boxes fail to start; here anything but
  # success fails. The exception is a merge or release job skipped outside a
  # release branch, where it is not meant to run.
  ci-ok:
    if: always() && (github.event_name != 'push' || github.repository == 'aleo-labs-protocol/snarkVM')
    needs: [check-shared-refs, fmt, deny, source-checks, wasm, lint, lint-locktick, semver, test, test-hosted, test-merge, each-feature, test-release, test-release-arm, machete, windows]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: >-
            ${{ github.event_name == 'workflow_dispatch' ||
            startsWith(github.ref, 'refs/heads/release/') ||
            startsWith(github.base_ref, 'release/') }}
        run: |
          jq -e --argjson release "$RELEASE" 'to_entries | map(select(.value.result != "success" and ($release or .value.result != "skipped" or (.key | IN("test-merge", "each-feature", "test-release", "test-release-arm", "machete", "windows") | not)))) | if length == 0 then true else (map("\(.key): \(.value.result)") | join(", ") | halt_error) end' <<< "$NEEDS"
