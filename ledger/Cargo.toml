[package]
name = "snarkvm-ledger"
version = "4.12.0"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A node ledger for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "web-programming" ]
license = "Apache-2.0"
edition = "2024"

[[test]]
name = "block-cache"
path = "tests/block_cache.rs"
required-features = [ "rocks" ]

[[bench]]
name = "block"
path = "benches/block.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "bonded_mapping"
path = "benches/bonded_mapping.rs"
harness = false

[[bench]]
name = "store"
path = "benches/store.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "advance"
path = "benches/advance.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "prepare_advance_multirecord"
path = "benches/prepare_advance_multirecord/main.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "dag"
path = "benches/dag.rs"
harness = false
required-features = ["test-helpers"]

[[bench]]
name = "transaction"
path = "benches/transaction.rs"
harness = false
required-features = [ "test_consensus_heights" ]

[[bench]]
name = "verify_transaction"
path = "benches/verify_transaction.rs"
harness = false
required-features = [ "test_consensus_heights" ]

[features]
default = [ "async", "indexmap/rayon", ]
async = [
  "snarkvm-ledger-narwhal/async",
  "snarkvm-ledger-query/async",
  "snarkvm-synthesizer/async"
]
locktick = [
  "dep:locktick",
  "snarkvm-ledger-puzzle/locktick",
  "snarkvm-ledger-store/locktick",
  "snarkvm-synthesizer/locktick"
]
metrics = [ "snarkvm-ledger-committee/metrics", "snarkvm-ledger-store/metrics" ]
# Enables the proving benchmarks in `benches/transaction.rs`.
#
# Off by default because proving a transaction takes seconds: on a shared CI
# runner the group adds tens of minutes, needs the multi-gigabyte universal SRS,
# and is variable enough to trip the benchmark action's alert threshold. The
# same three reasons the `varuna` and `store`/`advance` benchmarks are skipped
# in `.github/workflows/benchmarks.yml`.
#
# It requires `test_consensus_heights`, and that is not a convenience. The
# Varuna version is chosen from the block height, and the mainnet table does not
# reach `ConsensusVersion::V4` -- the V1 to V2 boundary -- until height
# 6_135_000. A benchmark on a freshly created chain would therefore prove with
# Varuna V1, which the network has not used since that height, and which does
# not even call `prover_prepare_third_round`. The test heights put V4 at height
# 7, which a benchmark can actually reach.
bench-prove = [ "test_consensus_heights" ]
profiler = [ "snarkvm-synthesizer/profiler" ]
test_consensus_heights = [ "snarkvm-console/test_consensus_heights", "snarkvm-synthesizer/test_consensus_heights" ]
prop-tests = [ "snarkvm-ledger-committee/prop-tests" ]
rocks = [ "snarkvm-ledger-store/rocks", "snarkvm-synthesizer/rocks" ]
serial = [
  "snarkvm-console/serial",
  "snarkvm-ledger-authority/serial",
  "snarkvm-ledger-block/serial",
  "snarkvm-ledger-committee/serial",
  "snarkvm-ledger-narwhal/serial",
  "snarkvm-ledger-puzzle/serial",
  "snarkvm-ledger-query/serial",
  "snarkvm-ledger-store/serial",
  "snarkvm-synthesizer/serial"
]
test = [
  "snarkvm-console/test",
  "snarkvm-ledger-block/test",
  "snarkvm-ledger-store/test",
  "snarkvm-synthesizer/test"
]
test-helpers = [
  "snarkvm-ledger-test-helpers",
  "snarkvm-ledger-committee/test-helpers",
  "snarkvm-ledger-narwhal/test-helpers",
  "dep:snarkvm-circuit"
]
test_targets = [
  "snarkvm-console/test_targets",
]
dev-committee = []
dev_genesis_state_root = [ "snarkvm-ledger-store/dev_genesis_state_root" ]
dev-print = [ "snarkvm-utilities/dev-print" ]
timer = [ "aleo-std/timer" ]

[dependencies.snarkvm-console]
workspace = true

[dependencies.snarkvm-ledger-authority]
workspace = true

[dependencies.snarkvm-ledger-block]
workspace = true

[dependencies.snarkvm-ledger-committee]
workspace = true

[dependencies.snarkvm-circuit]
workspace = true
optional = true

[dependencies.snarkvm-ledger-narwhal]
workspace = true

[dependencies.snarkvm-ledger-puzzle]
workspace = true

[dependencies.snarkvm-ledger-query]
workspace = true
features = [ "query" ]

[dependencies.snarkvm-ledger-store]
workspace = true

[dependencies.snarkvm-ledger-test-helpers]
workspace = true
optional = true

[dependencies.snarkvm-synthesizer]
workspace = true

[dependencies.snarkvm-synthesizer-error]
workspace = true

[dependencies.snarkvm-utilities]
workspace = true

[dependencies.aleo-std]
workspace = true
features = [ "storage" ]

[dependencies.anyhow]
workspace = true

[dependencies.cfg-if]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde" ]

[dependencies.locktick]
workspace = true
features = [ "parking_lot" ]
optional = true

[dependencies.lru]
workspace = true

[dependencies.parking_lot]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.rand_chacha]
workspace = true

[dependencies.rayon]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.time]
workspace = true

[dependencies.tracing]
workspace = true

[dev-dependencies.bincode]
workspace = true

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.snarkvm-console]
workspace = true
features = [ "filesystem" ]

[dev-dependencies.snarkvm-ledger]
path = "."
features = [ "test-helpers" ]

[dev-dependencies.snarkvm-ledger-block]
workspace = true
features = [ "test" ]

[dev-dependencies.snarkvm-ledger-test-helpers]
workspace = true

[dev-dependencies.aleo-std-storage]
workspace = true

[dev-dependencies.serde_json]
workspace = true
features = [ "preserve_order" ]

[dev-dependencies.snarkvm-circuit]
workspace = true

[dev-dependencies.snarkvm-synthesizer]
workspace = true
features = [ "test" ]

[dev-dependencies.tracing-subscriber]
version = "0.3"
features = [ "env-filter", "std" ]
