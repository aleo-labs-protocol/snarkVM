[package]
name = "snarkvm-ledger"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "A node ledger for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [ "cryptography", "web-programming" ]
license = "Apache-2.0"
edition = "2024"

[[test]]
name = "block-cache"
path = "tests/block_cache.rs"
required-features = [ "rocks" ]

[[bench]]
name = "block"
path = "benches/block.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "bonded_mapping"
path = "benches/bonded_mapping.rs"
harness = false

[[bench]]
name = "store"
path = "benches/store.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "advance"
path = "benches/advance.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "prepare_advance_multirecord"
path = "benches/prepare_advance_multirecord/main.rs"
harness = false
required-features = [ "test-helpers", "rocks" ]

[[bench]]
name = "dag"
path = "benches/dag.rs"
harness = false

[[bench]]
name = "transaction"
path = "benches/transaction.rs"
harness = false
required-features = [ "dev-network" ]

[[bench]]
name = "verify_transaction"
path = "benches/verify_transaction.rs"
harness = false
required-features = [ "dev-network" ]

[[bench]]
name = "prove"
path = "benches/prove.rs"
harness = false
required-features = [ "dev-network" ]

[features]
default = [ "async", "indexmap/rayon", ]
async = [
  "snarkvm-ledger-narwhal/async",
  "snarkvm-ledger-query/async",
  "snarkvm-synthesizer/async"
]
metrics = [ "snarkvm-ledger-committee/metrics", "snarkvm-ledger-store/metrics" ]
# Lowers network parameters (consensus heights, genesis targets) for local test and development networks; never enable it to join a public network, including testnet.
dev-network = [ "snarkvm-console/dev-network", "snarkvm-synthesizer/dev-network" ]
rocks = [ "snarkvm-ledger-store/rocks", "snarkvm-synthesizer/rocks" ]
# Helpers for tests. They are not part of the API, and semver does not cover them.
# Keep the [dev-dependencies] in sync with this list: the unit tests build `test_helpers` through
# `cfg(test)`, without this feature.
test-helpers = [
  "dep:snarkvm-ledger-test-helpers",
  "snarkvm-ledger-committee/test-helpers",
  "snarkvm-ledger-narwhal/test-helpers",
  "dep:snarkvm-circuit",
  "snarkvm-console/test-helpers"
]
# Adds `Ledger::load_with_dev_committee`, which replaces the round-based committee lookups with a deterministic committee from a start round, to extend a copied ledger with blocks it signs; inert unless that loader or its unchecked variant is called.
# The caller must also relax its own block checks; combined with `dev-network` it cannot load a production ledger, whose genesis that feature rejects. Never enable it to join a public network.
dev-committee-override = [ ]
dev_genesis_state_root = [ "snarkvm-ledger-store/dev_genesis_state_root" ]

[dependencies.snarkvm-console]
workspace = true

[dependencies.snarkvm-ledger-authority]
workspace = true

[dependencies.snarkvm-ledger-block]
workspace = true

[dependencies.snarkvm-ledger-committee]
workspace = true

[dependencies.snarkvm-circuit]
workspace = true
optional = true

[dependencies.snarkvm-ledger-narwhal]
workspace = true

[dependencies.snarkvm-ledger-puzzle]
workspace = true

[dependencies.snarkvm-ledger-query]
workspace = true
features = [ "query" ]

[dependencies.snarkvm-ledger-store]
workspace = true

[dependencies.snarkvm-ledger-test-helpers]
workspace = true
optional = true

[dependencies.snarkvm-synthesizer]
workspace = true

[dependencies.snarkvm-synthesizer-error]
workspace = true

[dependencies.snarkvm-utilities]
workspace = true

[dependencies.anyhow]
workspace = true

[dependencies.cfg-if]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde" ]

[dependencies.lru]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.rand_chacha]
workspace = true

[dependencies.rayon]
workspace = true

[dependencies.thiserror]
workspace = true

[dependencies.time]
workspace = true

[dependencies.tracing]
workspace = true

[dev-dependencies.bincode]
workspace = true

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.snarkvm-console]
workspace = true
features = [ "filesystem", "test-helpers", "dev-network" ]

[dev-dependencies.snarkvm-ledger-committee]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm-ledger-narwhal]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm-ledger-test-helpers]
workspace = true

[dev-dependencies.serde_json]
workspace = true
features = [ "preserve_order" ]

[dev-dependencies.snarkvm-circuit]
workspace = true

[dev-dependencies.tracing-subscriber]
workspace = true
features = [ "env-filter", "std" ]
