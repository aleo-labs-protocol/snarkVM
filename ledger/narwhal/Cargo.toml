[package]
name = "snarkvm-ledger-narwhal"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Data structures for a Narwhal-style memory pool in a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [
  "compilers",
  "cryptography",
  "mathematics",
  "wasm",
  "web-programming"
]
include = [ "Cargo.toml", "src", "README.md", "LICENSE.md" ]
license = "Apache-2.0"
edition = "2024"

[features]
async = [ "snarkvm-ledger-narwhal-data/async" ]
# Helpers for tests. They are not part of the API, and semver does not cover them.
test-helpers = [
  "snarkvm-ledger-narwhal-batch-certificate/test-helpers",
  "snarkvm-ledger-narwhal-batch-header/test-helpers",
  "snarkvm-ledger-narwhal-subdag/test-helpers",
  "snarkvm-ledger-narwhal-transmission/test-helpers",
  "snarkvm-ledger-narwhal-transmission-id/test-helpers"
]

[dependencies.snarkvm-ledger-narwhal-batch-certificate]
workspace = true

[dependencies.snarkvm-ledger-narwhal-batch-header]
workspace = true

[dependencies.snarkvm-ledger-narwhal-data]
workspace = true

[dependencies.snarkvm-ledger-narwhal-subdag]
workspace = true

[dependencies.snarkvm-ledger-narwhal-transmission]
workspace = true

[dependencies.snarkvm-ledger-narwhal-transmission-id]
workspace = true

[dev-dependencies.snarkvm-ledger-narwhal]
path = "."
features = [ "test-helpers" ]
