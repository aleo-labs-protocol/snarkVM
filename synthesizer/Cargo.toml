[package]
name = "snarkvm-synthesizer"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Synthesizer for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
keywords = [
  "aleo",
  "cryptography",
  "blockchain",
  "decentralized",
  "zero-knowledge"
]
categories = [
  "compilers",
  "cryptography",
  "mathematics",
  "wasm",
  "web-programming"
]
include = [ "Cargo.toml", "src", "README.md", "LICENSE.md" ]
license = "Apache-2.0"
edition = "2024"

[features]
async = [ "snarkvm-ledger-query/async", "snarkvm-synthesizer-process/async" ]
cuda = [ "snarkvm-algorithms/cuda" ]
rocks = [ "snarkvm-ledger-store/rocks" ]
test = [ "snarkvm-console/test", "snarkvm-ledger-store/test", "snarkvm-synthesizer-process/test" ]
test-old-consensus-versions = [ "test" ]
test-helpers = [ ]
wasm = [ "snarkvm-console/wasm", "snarkvm-synthesizer-process/wasm" ]
dev_skip_checks = [ "snarkvm-synthesizer-process/dev_skip_checks" ]
test_consensus_heights = [ "snarkvm-synthesizer-process/test_consensus_heights" ]

[[bench]]
name = "kary_merkle_tree"
path = "benches/kary_merkle_tree.rs"
harness = false

[[bench]]
name = "total_deployment_verification"
path = "benches/total_deployment_verification.rs"
harness = false

[[bench]]
name = "check_transaction_multirecord"
path = "benches/check_transaction_multirecord/main.rs"
harness = false

[dependencies.snarkvm-algorithms]
workspace = true

[dependencies.snarkvm-circuit]
workspace = true

[dependencies.snarkvm-console]
workspace = true

[dependencies.snarkvm-ledger-authority]
workspace = true

[dependencies.snarkvm-ledger-block]
workspace = true

[dependencies.snarkvm-ledger-committee]
workspace = true

[dependencies.snarkvm-ledger-narwhal-data]
workspace = true

[dependencies.snarkvm-ledger-puzzle]
workspace = true

[dependencies.snarkvm-ledger-puzzle-epoch]
workspace = true
features = [ "synthesis" ]

[dependencies.snarkvm-ledger-query]
workspace = true
features = [ "query" ]

[dependencies.snarkvm-ledger-store]
workspace = true

[dependencies.snarkvm-synthesizer-error]
workspace = true

[dependencies.snarkvm-synthesizer-process]
workspace = true

[dependencies.snarkvm-synthesizer-program]
workspace = true

[dependencies.snarkvm-synthesizer-snark]
workspace = true

[dependencies.snarkvm-utilities]
workspace = true

[dependencies.anyhow]
workspace = true

[dependencies.indexmap]
workspace = true
features = [ "serde", "rayon" ]

[dependencies.itertools]
workspace = true

[dependencies.lru]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.rayon]
workspace = true

[dependencies.serde]
workspace = true
features = [ "derive" ]

[dependencies.serde_json]
workspace = true
features = [ "preserve_order" ]

[dependencies.tokio]
version = "1"
features = [ "sync" ]

[dependencies.tracing]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[dev-dependencies.anyhow]
workspace = true

[dev-dependencies.bincode]
workspace = true

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.hex]
workspace = true

[dev-dependencies.k256]
workspace = true

[dev-dependencies.snarkvm-console]
workspace = true
features = [ "filesystem", "test-helpers", "test_consensus_heights" ]

[dev-dependencies.snarkvm-ledger-committee]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm-ledger-narwhal-subdag]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm-synthesizer-process]
workspace = true
features = [ "test", "test-helpers" ]

[dev-dependencies.snarkvm-synthesizer-snark]
workspace = true
features = [ "test-helpers" ]

[dev-dependencies.snarkvm-ledger-test-helpers]
path = "../ledger/test-helpers"

[dev-dependencies.rayon]
workspace = true

[dev-dependencies.serde_yaml]
version = "0.9"

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.walkdir]
version = "2"
