[package]
name = "snarkvm-console"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Console environment for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
license = "Apache-2.0"
edition = "2024"

[dependencies.snarkvm-console-account]
workspace = true
optional = true

[dependencies.snarkvm-console-algorithms]
workspace = true
optional = true

[dependencies.snarkvm-console-collections]
workspace = true
optional = true

[dependencies.snarkvm-console-network]
workspace = true
optional = true

[dependencies.snarkvm-console-program]
workspace = true
optional = true

[dependencies.snarkvm-console-types]
workspace = true
optional = true

[features]
default = [
  "account",
  "algorithms",
  "collections",
  "filesystem",
  "network",
  "program",
  "types"
]
wasm = [ "snarkvm-console-network/wasm" ]
test = [ "snarkvm-console-network/test" ]
account = [ "network", "dep:snarkvm-console-account" ]
algorithms = [ "dep:snarkvm-console-algorithms" ]
collections = [ "algorithms", "dep:snarkvm-console-collections" ]
filesystem = [ "snarkvm-console-network/filesystem" ]
network = [ "collections", "dep:snarkvm-console-network" ]
program = [ "network", "dep:snarkvm-console-program" ]
types = [ "dep:snarkvm-console-types" ]
# Lowers network parameters (consensus heights, genesis targets) for local test and development networks; never enable it to join a public network, including testnet.
dev-network = [ "snarkvm-console-network/dev-network" ]
dev_skip_checks = [ ]
# Helpers for tests. They are not part of the API, and semver does not cover them.
test-helpers = [
  "snarkvm-console-account?/test-helpers",
  "snarkvm-console-network/test-helpers",
  "snarkvm-console-program?/test-helpers"
]
