[package]
name = "snarkvm-console-network"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Network console library for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
license = "Apache-2.0"
edition = "2024"

[features]
dev-print = [ "snarkvm-console-algorithms/dev-print", "snarkvm-console-network-environment/dev-print" ]
filesystem = [ "snarkvm-algorithms/filesystem", "snarkvm-parameters/filesystem" ]
wasm = [
  "snarkvm-parameters/wasm"
]
test = [ ]
test_targets = [ ]
test_consensus_heights = [ ]
test-helpers = [ "snarkvm-console-network-environment/test-helpers" ]

[dependencies.snarkvm-algorithms]
workspace = true

[dependencies.snarkvm-console-algorithms]
workspace = true

[dependencies.snarkvm-console-collections]
workspace = true

[dependencies.snarkvm-console-network-environment]
workspace = true

[dependencies.snarkvm-console-types]
workspace = true
features = [ "field", "group", "scalar" ]

[dependencies.snarkvm-curves]
workspace = true

[dependencies.snarkvm-parameters]
workspace = true

[dependencies.anyhow]
workspace = true

[dependencies.enum-iterator]
workspace = true

[dependencies.indexmap]
workspace = true

[dependencies.lazy_static]
workspace = true

[dependencies.serde]
workspace = true

[dependencies.paste]
workspace = true

[dev-dependencies.snarkvm-console-network-environment]
workspace = true
features = [ "test-helpers" ]

[package.metadata.cargo-machete]
ignored = ["paste"]

# Minor releases add `ConsensusVersion` variants; see its documentation. The setting covers every
# public enum of this crate. Today `ConsensusVersion` is the only one.
[package.metadata.cargo-semver-checks.lints]
enum_variant_added = "allow"
