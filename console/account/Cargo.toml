[package]
name = "snarkvm-console-account"
version = "4.13.1"
authors = [ "The Aleo Team <hello@aleo.org>" ]
description = "Account operations for a decentralized virtual machine"
homepage = "https://aleo.org"
repository = "https://github.com/ProvableHQ/snarkVM"
license = "Apache-2.0"
edition = "2024"

[[bench]]
name = "account"
path = "benches/account.rs"
harness = false

[dependencies.snarkvm-console-network]
workspace = true

[dependencies.snarkvm-console-types]
workspace = true
features = [ "address", "boolean", "field", "group", "scalar" ]

[dependencies.bs58]
version = "0.5"

[dependencies.tracing]
workspace = true

[dependencies.zeroize]
workspace = true
features = [ "derive" ]

[dev-dependencies.bincode]
workspace = true

[dev-dependencies.criterion]
workspace = true

[dev-dependencies.serde_json]
workspace = true
features = [ "preserve_order" ]

[dev-dependencies.tracing-test]
workspace = true

[dev-dependencies.snarkvm-console-network]
workspace = true
features = [ "test-helpers" ]

[features]
# Helpers for tests. They are not part of the API, and semver does not cover them.
test-helpers = [ ]
